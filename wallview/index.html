outline:3px solid var(--accent);outline-offset:1px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:14px;font-weight:600}.field input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}.file-button{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);background:#314252;color:white;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;text-align:center}.file-button input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.photo-card{display:flex;gap:12px;align-items:center;background:#19232c;padding:10px;border-radius:10px;margin-top:8px}.photo-card img{width:78px;height:64px;object-fit:cover;border-radius:7px;background:#111820}.photo-card .info{min-width:0;overflow-wrap:anywhere}.photo-card strong{display:block;font-size:13px}.tag{display:inline-block;border-radius:999px;padding:4px 9px;background:#39516a;font-size:12px;font-weight:700}.tag.locked{background:#285d44}.empty{background:#18232c;border:1px dashed #586978;border-radius:10px;padding:14px;color:var(--muted);line-height:1.45}.range-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.range-line strong{min-width:55px;text-align:right}.notice{padding:11px 12px;border-left:4px solid var(--accent);background:#2a302e;border-radius:7px;color:#f4e6c7;font-size:13px;line-height:1.4}.hidden{display:none!important}footer{color:#8f9eaa;font-size:11px;text-align:center;padding:12px}
    .photo-card{position:relative}.photo-card.photo-openable{cursor:zoom-in}.compact-actions{margin:8px 0 0}.compact-actions>*{flex:0 1 auto}.final-back-row{display:flex;justify-content:flex-start;margin:-8px 0 8px}.plan-delete{position:absolute;right:8px;top:8px;z-index:3;width:38px;height:38px;padding:0;border-radius:50%;font-size:21px}.plan-dot-title{cursor:pointer}.point-notes{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#19232c;color:var(--text);font:15px/1.45 system-ui;resize:vertical}.photo-thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.photo-thumbs .photo-card{gap:6px;padding:6px;margin-top:8px;min-width:0}.photo-thumbs .photo-card img{width:58px;height:48px}.photo-delete{position:absolute;right:7px;top:7px;width:32px;height:32px;border-radius:50%;border:1px solid #ffffff88;background:#111820e8;color:#fff;font:700 18px system-ui;line-height:1;cursor:pointer;z-index:1}.photo-modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#0009;padding:20px}.photo-modal-card{width:min(100%,360px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.photo-modal-actions{display:flex;gap:10px;margin-top:16px}.photo-viewer{position:fixed;inset:0;z-index:40;background:#080b0e;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}.viewer-head,.viewer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px}.viewer-stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;display:grid;place-items:center}.viewer-stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}.final-screen{position:fixed;inset:0;z-index:30;background:#080b0e;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-in     .alignment-page{padding-bottom:calc(118px + env(safe-area-inset-bottom))}.alignment-mode-buttons{display:grid;grid-template-columns:1fr 1fr;margin:8px 0}.alignment-mode-buttons .btn{padding-left:8px;padding-right:8px}.alignment-mode-buttons .btn.selected{background:var(--green);border-color:#369965}.alignment-auto{margin:8px 0}.alignment-auto .btn{width:100%}.alignment-manual summary{font-weight:700;cursor:pointer;padding:3px 0}.alignment-notes .btn{text-align:left;width:100%}.alignment-lock-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#111820ed;border-top:1px solid var(--line);box-shadow:0 -5px 18px #0006}.alignment-lock-bar .btn{display:block;width:100%;max-width:900px;margin:0 auto}
    @media(max-width:560px){main{padding:12px 10px calc(24px + env(safe-area-inset-bottom))}.grid2{grid-template-columns:1fr}.panel{padding:12px}.canvas-wrap.plan{height:55vh;min-height:235px}.canvas-wrap.wall{height:48vh;min-height:230px}.btn{font-size:14px;padding:10px 12px}.actions{gap:7px}.final-screen{padding-left:0;padding-right:0}.final-top{padding:0 8px}.final-screen .final-controls{left:8px;right:8px}}
    .final-screen #final-gallery{display:grid;grid-template: minmax(0,1fr) / minmax(0,1fr);touch-action:none}
    .final-detail{width:100%;height:100%;min-height:0;object-fit:contain;transform-origin:center;user-select:none;pointer-events:none}
    .final-screen #overlay-controls{position:static;margin:6px 8px 0;padding:5px 10px}
    .final-gallery-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 0;color:var(--text)}
    .final-gallery-actions .meta{white-space:nowrap;margin-left:auto}
    .gallery-picker{color:var(--text);max-height:85dvh;overflow:auto}
    .gallery-picker::backdrop{background:#0009}
    /* Brand and layout */
    :root {
      --bg:#111820; --panel:#1D2731; --panel2:#27323D; --text:#F3F5F6;
      --muted:#B2BDC7; --accent:#E4AD54; --positive:#73B9A1;
      --line:#687888; --control:#344352; --red:#733D42; --ink:#14191F;
    }
    body{line-height:1.45}
    main{padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right))}
    h1,h2,h3{overflow-wrap:anywhere;text-wrap:balance}
    h1{font-size:clamp(1.4rem,5vw,1.9rem);letter-spacing:-.025em}
    h2{line-height:1.25}
    p{margin-bottom:10px}
    .top{margin-bottom:12px}
    .top>div,.row>div{min-width:0}
    .wallview-brand{gap:12px;padding:4px 0 8px;margin-bottom:6px}
    .wallview-brand img{display:block;flex:none;border-radius:12px}
    .brand-copy{flex:1}
    .wallview-brand h1{font-size:clamp(1.8rem,7vw,2.45rem);margin:0}
    .brand-credit{color:var(--muted);font-size:.75rem;font-weight:650;letter-spacing:.045em}
    footer,.meta,.hint{color:var(--muted)}
    .panel,.project-card,.wall-card,.photo-modal-card,.photo-info-card{
      background:var(--panel);border:1px solid #3E4D5C;
    }
    .panel{border-radius:12px;margin:10px 0}
    .project-card,.wall-card{padding:12px}
    #wall-list{margin-top:8px}
    #wall-list .wall-card,.photo-card{background:var(--panel2)}
    .photo-section{margin-block:8px}
    .photo-section h2{color:var(--text)}
    .photo-thumbs .photo-card .info{padding-right:15px}
    .photo-card .info{min-width:0;overflow-wrap:anywhere}
    .photo-card:has(.photo-delete) .info{padding-inline-end:40px}
    .photo-thumbs .photo-card:has(.photo-delete) .info{padding-inline-end:28px}
    .photo-delete{width:36px;height:36px;right:5px;top:5px}
    .tag{background:var(--panel2);color:var(--muted);border:1px solid #566676}
    .tag.locked{background:#1B3834;color:#9AD6C2;border-color:#43786A}
    .empty{background:var(--panel);border-color:var(--line)}
    .notice{background:#302A23}
    .plan-dot-title{color:var(--text);text-decoration:underline;text-underline-offset:3px}
    summary{min-height:44px;align-content:center}
    .point-notes,.field input:not([type=range]){background:var(--panel2);color:var(--text)}
    .field label{overflow-wrap:anywhere}
    .btn,.file-button{
      border:1px solid var(--line);border-radius:10px;background:var(--control);color:var(--text);
      padding:9px 13px;min-height:48px;font:650 .9375rem/1.25 system-ui,sans-serif;text-align:center;
      white-space:normal;overflow-wrap:anywhere;
    }
    .btn.small{padding:7px 11px;min-height:44px;font-size:.875rem}
    .btn.subtle{background:transparent}
    .btn.gold,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
    .btn.danger{background:var(--red);border-color:#B07277}
    .alignment-mode-buttons .btn.selected{background:var(--positive);border-color:var(--positive);color:var(--ink)}
    #lock-alignment{background:var(--positive);border-color:var(--positive);color:var(--ink)}
    .btn:focus-visible,.file-button:focus-within,summary:focus-visible,[tabindex]:focus-visible{
      outline:2px solid var(--accent);outline-offset:2px;
    }
    input[type=range]{margin-inline:0;min-width:0}
    .btn.plan-delete,.info-button{min-width:44px;min-height:44px;padding:0}
    .btn.plan-delete{border-radius:50%}
    .final-screen{background:#10171E}
    .final-top{grid-template-columns:minmax(0,.9fr) minmax(0,1.12fr) minmax(0,1.4fr);gap:6px;max-width:45rem;width:100%;margin-inline:auto}
    .final-top .left,.final-top .right{justify-self:stretch}
    .final-top .btn{width:100%}
    .final-title{white-space:normal;overflow-wrap:anywhere;text-overflow:clip;line-height:1.2}
    .final-heading{padding-inline:8px}
    .final-gallery-actions{padding-inline:8px;min-width:0}
    .final-screen #overlay-controls{margin-top:4px}
    .viewer-head strong{min-width:0;overflow-wrap:anywhere}
    @media(max-width:560px){
      .project-card>.row,.wall-card>.row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
      .project-card .compact-actions,.wall-card .compact-actions{margin:0;gap:6px}
      .compact-actions>.btn{flex:0 1 auto;min-width:0}
      .photo-thumbs .photo-card{align-items:flex-start;flex-direction:column}
      .photo-thumbs .photo-card:has(.photo-delete) .info{padding-inline-end:0}
      .final-top .btn,.final-gallery-actions .btn{padding-inline:6px;font-size:.8125rem}
      .final-back-row{margin:0 8px 3px}
      .final-screen #overlay-controls{padding-block:3px}
      .alignment-mode-buttons{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    .welcome-screen{
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
      min-height:calc(100dvh - 24px - env(safe-area-inset-bottom));
      max-width:32rem;margin:0 auto;padding:20px 12px;text-align:center;
    }
    .welcome-screen img{border-radius:14px}
    .welcome-screen h1{margin:0;font-size:clamp(2rem,10vw,3.5rem);line-height:1.1;letter-spacing:.02em}
    .welcome-screen p{margin:0}
    .welcome-screen .welcome-tagline{color:var(--positive);font-size:clamp(1.15rem,5vw,1.5rem);font-weight:700}
    .welcome-description{max-width:32ch}
    .welcome-start{width:min(100%,17rem);min-height:56px;margin-block:8px}
    .transfer-switch{
      display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;
      padding-block:6px;margin-bottom:6px;color:var(--text);font-weight:650;cursor:pointer;
    }
    .transfer-switch input{
      appearance:none;display:grid;align-items:center;flex:none;width:46px;height:30px;
      margin:0;padding:3px;border:1px solid var(--line);border-radius:99px;background:var(--panel2);cursor:pointer;
    }
    .transfer-switch input::before{
      content:'';width:22px;height:22px;border-radius:50%;background:var(--muted);
    }
    .transfer-switch input:checked{background:var(--positive);border-color:var(--positive)}
    .transfer-switch input:checked::before{justify-self:end;background:var(--ink)}
    .transfer-switch input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  </style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<input id="import-input" class="hidden" type="file" accept=".json,application/json">
<script>
(() => {
  'use strict';
  const DB_NAME='wallview-archive', DB_VERSION=1, STORE='projects';
  const app=document.getElementById('app');
  const pendingDeletions=new Set();
  const importInput=document.getElementById('import-input');
  const state={page:'home',project:null,wallId:null,installationId:null,urls:[],bitmaps:[],addPoint:false,saveTimer:0};
  const uid=()=>globalThis.crypto?.randomUUID?.()||('wv-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const fmtDate=v=>new Intl.DateTimeFormat('it-IT',{dateStyle:'medium'}).format(new Date(v||Date.now()));
  function clearMedia(){for(const u of state.urls)URL.revokeObjectURL(u);state.urls=[];for(const b of state.bitmaps){try{b.close()}catch{}}state.bitmaps=[]}
  function fileRef(file){return {blob:file,name:file.name||'immagine',type:file.type||'image/jpeg'}}
  function imageURL(ref){const u=URL.createObjectURL(ref.blob);state.urls.push(u);return u}
  function loadImage(ref){return new Promise((resolve,reject)=>{if(!ref?.blob)return reject(new Error('Fotografia non disponibile'));const img=new Image();const u=imageURL(ref);img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Impossibile leggere la fotografia'));img.src=u})}
  function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Archivio non disponibile'))})}
  async function allProjects(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).getAll();req.onsuccess=()=>resolve(req.result.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)));req.onerror=()=>reject(req.error)})}
  async function getProject(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
  async function saveProject(project=state.project){if(!project)return;project.schemaVersion=2;project.updatedAt=Date.now();const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(project);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Salvataggio non riuscito'));tx.onabort=()=>reject(tx.error||new Error('Salvataggio interrotto'))})}
  async function removeProjectRecord(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Eliminazione del progetto non riuscita'));tx.onabort=()=>reject(tx.error||new Error('Eliminazione del progetto interrotta'))})}
  function scheduleSave(){clearTimeout(state.saveTimer);state.saveTimer=setTimeout(()=>saveProject().catch(showError),220)}
  function flushSave(){clearTimeout(state.saveTimer);state.saveTimer=0;return saveProject()}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&state.page==='editor')flushSave().catch(()=>{})});
  window.addEventListener('pagehide',()=>{if(state.page==='editor')flushSave().catch(()=>{})});
  function showError(err){alert('Operazione non riuscita. '+(err?.message||''))}
  function wallById(id=state.wallId){return state.project?.walls?.find(w=>w.id===id)}
  function installationById(id=state.installationId){return wallById()?.installations?.find(i=>i.id===id)}
  function normalizeProjectData(project){let changed=project.schemaVersion!==2;if(!Array.isArray(project.walls))project.walls=[];for(const point of project.walls){if(!Array.isArray(point.installations)){point.installations=[{id:uid(),name:'Impianto 1',photoOpen:point.photoOpen||null,transform:point.transform||freshTransform(),opacity:point.opacity??.55,lockedAt:point.lockedAt||null,lockedTransform:point.lockedTransform||null}];delete point.photoOpen;delete point.transform;delete point.opacity;delete point.lockedAt;delete point.lockedTransform;changed=true}point.photoFinished=point.photoFinished||point.photoClosed||null;delete point.photoClosed;point.installations.forEach((installation,index)=>{if(!installation.id)installation.id=uid();if(!installation.name)installation.name=`Impianto ${index+1}`;if(!installation.transform)installation.transform=freshTransform();if(typeof installation.opacity!=='number')installation.opacity=.55;if(!Array.isArray(installation.extraPhotos))installation.extraPhotos=[]});if(!Array.isArray(point.extraPhotos))point.extraPhotos=[]}project.schemaVersion=2;return changed}
  function button(id,label,cls=''){return `<button id="${id}" class="btn ${cls}">${label}</button>`}
  function filePicker(id,label,accept='image/*'){return `<label class="file-button">${label}<input id="${id}" type="file" accept="${accept}"></label>`}
  function cameraPicker(id,label){return `<label class="file-button">${label}<input id="${id}" type="file" accept="image/*" capture="environment"></label>`}
  function backHeader(back,label,sub=''){return `<div class="top">${button(back,'← Indietro','small subtle')}<div style="flex:1"><h1>${label}</h1>${sub?`<div class="meta">${sub}</div>`:''}</div></div>`}

  // One access decision for the UI and the backup entry points.
  const projectTransferAccess=(()=>{
    const key='stripwall.project-transfer.enabled';
    let enabled=true;
    try{enabled=localStorage.getItem(key)!=='off';}catch{}
    return {
      allowed:()=>enabled,
      setAllowed(value){
        localStorage.setItem(key,value?'on':'off');
        enabled=value;
      }
    };
  })();

  function renderWelcome(){
    clearMedia();
    state.page='welcome';
    app.innerHTML=`<section class="welcome-screen" aria-labelledby="welcome-title">
      <img src="icon-192.png" width="64" height="64" alt="">
      <h1 id="welcome-title">STRIPWALL</h1>
      <p class="welcome-tagline">Vedi oltre la parete.</p>
      <p class="welcome-description">Fotografa gli impianti prima di chiudere le pareti. Ritrovali quando ne hai bisogno, sovrapponendo le immagini con un semplice cursore.</p>
      ${button('start-app','INIZIA →','primary welcome-start')}
      <p class="brand-credit">by OWL•09 STUDIO</p>
    </section>`;
    document.getElementById('start-app').onclick=renderHome;

  async function renderHome(){

      }catch(error){if(stillOpen())showError(error);}
      finally{setBusy(false);}
    };
  }
