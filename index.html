<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>owl•09 AR v0.3</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0c0f;color:white;font:14px system-ui}video,canvas{position:absolute;inset:0;width:100%;height:100%}video{object-fit:cover}canvas{pointer-events:none}#ui{position:absolute;left:0;right:0;top:14px;display:flex;justify-content:center;gap:9px;align-items:center}button{background:#181a1e;color:#fff;border:1px solid #aaa;border-radius:8px;padding:13px 22px;font:500 15px system-ui}#go{background:#f4f4f4;color:#171717;border:0}#info{position:absolute;bottom:12px;left:15px;right:15px;text-align:center;font:12px system-ui;color:#eee;text-shadow:0 1px 3px #000;background:#15151599;padding:9px;border-radius:9px}#replay{display:none}</style></head><body><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas><div id="ui"><button id="camera">Avvia fotocamera</button><button id="go">Clicca qui</button><button id="replay" aria-label="Rivedi">↻</button></div><div id="info">Inquadra il foglio, poi premi «Clicca qui».</div><script>
const video=document.querySelector('#video'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),info=document.querySelector('#info'),go=document.querySelector('#go'),replay=document.querySelector('#replay'),camera=document.querySelector('#camera');let active=false,tracked=null,runAt=null,finished=false,lastTrack=0;
const A=[691,932],B=[767,932],C=[691,1009],marks=[A,B,C];const slits=[[[515,252],[515,389]],[[309,389],[308,526]],[[580,663],[701,580]],[[418,681],[418,826]]];
const work=document.createElement('canvas');work.width=320;work.height=240;const wx=work.getContext('2d',{willReadFrequently:true});
function candidates(data,W,H){let black=new Uint8Array(W*H),seen=new Uint8Array(W*H),out=[];for(let i=0;i<W*H;i++){let j=i*4;black[i]=(.299*data[j]+.587*data[j+1]+.114*data[j+2])<100?1:0}for(let y=8;y<H-8;y++)for(let x=8;x<W-8;x++){let start=y*W+x;if(!black[start]||seen[start])continue;let q=[start],head=0,minx=x,maxx=x,miny=y,maxy=y,count=0;seen[start]=1;while(head<q.length){let z=q[head++],xx=z%W,yy=(z/W)|0;count++;minx=Math.min(minx,xx);maxx=Math.max(maxx,xx);miny=Math.min(miny,yy);maxy=Math.max(maxy,yy);for(let d of [-1,1,-W,W]){let n=z+d;if(n<0||n>=W*H||seen[n]||!black[n])continue;if((d===-1&&xx===0)||(d===1&&xx===W-1))continue;seen[n]=1;q.push(n)}}let ww=maxx-minx+1,hh=maxy-miny+1;if(count>=5&&count<1000&&ww>=3&&hh>=3&&ww/hh>.6&&ww/hh<1.5&&count/(ww*hh)>.45)out.push({x:(minx+maxx)/2,y:(miny+maxy)/2,s:(ww+hh)/2})}return out}
function detect(){if(!active||video.readyState<2)return;let W=320,H=Math.max(120,Math.round(video.videoHeight/video.videoWidth*W));work.height=H;wx.drawImage(video,0,0,W,H);let cs=candidates(wx.getImageData(0,0,W,H).data,W,H),best=null,score=Infinity;for(let a of cs)for(let b of cs)for(let d of cs){if(a===b||a===d||b===d)continue;let dx=b.x-a.x,dy=d.y-a.y,hor=Math.abs(b.y-a.y),ver=Math.abs(d.x-a.x),dist=Math.hypot(dx,dy);if(dx<8||dy<8||hor>dist*.28||ver>dist*.28||Math.abs(dx-dy)>dist*.4)continue;let err=hor+ver+Math.abs(dx-dy)+2*(Math.abs(a.s-b.s)+Math.abs(a.s-d.s));if(err<score){score=err;best=[a,b,d]}}if(best){let s=Math.max(canvas.width/video.videoWidth,canvas.height/video.videoHeight),ox=(canvas.width-video.videoWidth*s)/2,oy=(canvas.height-video.videoHeight*s)/2;let next=best.map(p=>({x:ox+p.x/W*video.videoWidth*s,y:oy+p.y/H*video.videoHeight*s}));if(tracked&&next.every((p,i)=>Math.hypot(p.x-tracked[i].x,p.y-tracked[i].y)<canvas.width*.12)){tracked=next.map((p,i)=>({x:tracked[i].x*.82+p.x*.18,y:tracked[i].y*.82+p.y*.18}))}else if(!tracked)tracked=next;lastTrack=performance.now()}else if(performance.now()-lastTrack>1200)tracked=null}
function demo(){let scale=Math.min(canvas.width/1024,canvas.height/1365)*.92,ox=(canvas.width-1024*scale)/2,oy=(canvas.height-1365*scale)/2;return marks.map(p=>({x:ox+p[0]*scale,y:oy+p[1]*scale}))}function point(p,t){let u=(p[0]-A[0])/76,v=(p[1]-A[1])/77;return{x:t[0].x+u*(t[1].x-t[0].x)+v*(t[2].x-t[0].x),y:t[0].y+u*(t[1].y-t[0].y)+v*(t[2].y-t[0].y)}}function mix(a,b,f){return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f}}function ease(f){f=Math.max(0,Math.min(1,f));return f*f*(3-2*f)}function stroke(a,b,color='#eee',width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function stick(p,size,angle=0,headOnly=false){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(angle);ctx.strokeStyle='#00dfff';ctx.lineWidth=Math.max(2,size*.09);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.arc(0,-size*.56,size*.19,0,Math.PI*2);if(!headOnly){ctx.moveTo(0,-size*.36);ctx.lineTo(0,size*.1);ctx.moveTo(0,-size*.2);ctx.lineTo(-size*.27,0);ctx.moveTo(0,-size*.2);ctx.lineTo(size*.27,0);ctx.moveTo(0,size*.1);ctx.lineTo(-size*.25,size*.45);ctx.moveTo(0,size*.1);ctx.lineTo(size*.25,size*.45)}ctx.stroke();ctx.restore()}
function scene(now){let w=innerWidth*devicePixelRatio,h=innerHeight*devicePixelRatio;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.clearRect(0,0,w,h);let t=active?tracked:demo();if(!t||runAt===null||finished)return;let s=Math.max(12,Math.hypot(t[1].x-t[0].x,t[1].y-t[0].y)*.52),p=slits.map(seg=>point([(seg[0][0]+seg[1][0])/2,(seg[0][1]+seg[1][1])/2],t)),origin=point([552,316],t),elapsed=(now-runAt)/1000;
// 0-4.8: looks around, enters first slit
if(elapsed<4.8){let f=elapsed;if(f<2.1)stick(origin,s,Math.sin(f*4)*.14);else if(f<4.5){let q=mix(origin,p[0],ease((f-2.1)/2.4));stick(q,s,0)}return}
// 4.8-8.8: head peeks out of upper-left slit and disappears
if(elapsed<8.8){let f=elapsed-4.8,amount=f<1?ease(f):f<2.8?1:ease((4.0-f)/1.2);let q={x:p[1].x+s*.28*amount,y:p[1].y};if(amount>.01)stick(q,s,Math.sin(f*2)*.15,true);return}
// 8.8-15.8: rope extends, figure descends, looks, climbs
if(elapsed<15.8){let f=elapsed-8.8,top=point([639,606],t),bottom=point([639,810],t),rope=ease(Math.min(1,f/1.2));stroke(top,mix(top,bottom,rope),'#e2e2e2',Math.max(1,s*.045));if(f>1.2&&f<6.5){let down=f<3.2?ease((f-1.2)/2):f<4.6?1:1-ease((f-4.6)/1.9);let q=mix(top,bottom,down);stick(q,s, f>3.2&&f<4.6?Math.sin(f*3)*.12:0)}return}
// 15.8-23.5: board launches, 1-second pause, leap and bounce toward slit 1
if(elapsed<23.5){let f=elapsed-15.8,start=p[3],board={x:start.x+s*.75,y:start.y+s*.1},end={x:p[0].x-s*.1,y:p[0].y};if(f<5.8){let extension=ease(Math.min(1,f/.75));stroke(start,mix(start,board,extension),'#ddd',Math.max(2,s*.09))}if(f>=1.75){let q;if(f<3.2){let a=ease((f-1.75)/1.45);q=mix(start,board,a);q.y-=s*.7*Math.sin(Math.PI*a)}else if(f<4.3){let a=ease((f-3.2)/1.1);q={x:board.x+s*.12*a,y:board.y-s*.9*Math.sin(Math.PI*a)} }else{let a=ease((f-4.3)/3.2);q=mix(board,end,a);q.y-=s*1.6*Math.sin(Math.PI*a)}stick(q,s)}return}
finished=true;replay.style.display='inline-block';info.textContent='';}
function frame(now){scene(now);requestAnimationFrame(frame)}requestAnimationFrame(frame);setInterval(detect,450);
camera.onclick=async()=>{try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();active=true;camera.style.display='none';info.textContent='Inquadra il foglio, poi premi «Clicca qui».'}catch(e){info.textContent='Fotocamera non disponibile: '+e.message}};
function start(){if(active&&!tracked){info.textContent='Inquadra tutto il foglio: i marcatori non sono ancora riconosciuti.';return}runAt=performance.now();finished=false;go.style.display='none';replay.style.display='none';info.textContent=''}go.onclick=start;replay.onclick=start;
</script></body></html>
