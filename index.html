<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>owl•09 AR v0.2</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0c0f;color:#fff;font:14px system-ui}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}video{object-fit:cover}#overlay{pointer-events:none}header{position:absolute;top:10px;left:8px;right:8px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center}button{background:#20232b;color:white;border:1px solid #777;border-radius:12px;padding:12px;font-size:14px}#status{position:absolute;bottom:12px;left:12px;right:12px;background:#111c;padding:12px;border-radius:12px;text-align:center}#hint{position:absolute;top:120px;left:12px;right:12px;text-align:center;color:#ffda65;font-size:13px}</style></head><body><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><header><button id="camera">📷 Avvia fotocamera</button><button id="play">⏯ Animazione</button><button id="auto">Auto: ON</button><button id="demo">Demo</button></header><div id="hint">Inquadra il foglio completo con il riquadro QR TEST ben visibile</div><div id="status">owl•09 AR v0.2 · modalità demo pronta</div><script>
const v=document.getElementById('video'),c=document.getElementById('overlay'),ctx=c.getContext('2d'),status=document.getElementById('status');let active=false,auto=true,playing=true,tracked=null,lastDetect=0,started=performance.now(),phase=0;const work=document.createElement('canvas');work.width=320;work.height=240;const wx=work.getContext('2d',{willReadFrequently:true});
// Coordinate del foglio di prova fotografato. Le tre caselle sono in basso a destra.
const A={x:691,y:932},B={x:767,y:932},C={x:691,y:1009};const marks=[A,B,C];const lineSegments=[[[515,252],[515,389]],[[309,389],[308,526]],[[418,681],[418,826]],[[580,663],[701,580]]];
function project(p,t){const u=(p[0]-A.x)/76,w=(p[1]-A.y)/77;return {x:t[0].x+u*(t[1].x-t[0].x)+w*(t[2].x-t[0].x),y:t[0].y+u*(t[1].y-t[0].y)+w*(t[2].y-t[0].y)}}
function candidates(data,W,H){const grey=new Uint8Array(W*H),seen=new Uint8Array(W*H),out=[];for(let i=0;i<W*H;i++){let k=i*4;grey[i]=(.299*data[k]+.587*data[k+1]+.114*data[k+2])<100?1:0}for(let y=8;y<H-8;y++)for(let x=8;x<W-8;x++){let start=y*W+x;if(!grey[start]||seen[start])continue;let q=[start],head=0;seen[start]=1;let minx=x,maxx=x,miny=y,maxy=y,count=0;while(head<q.length){let z=q[head++],xx=z%W,yy=(z/W)|0;count++;minx=Math.min(minx,xx);maxx=Math.max(maxx,xx);miny=Math.min(miny,yy);maxy=Math.max(maxy,yy);for(let d of [-1,1,-W,W]){let n=z+d;if(n<0||n>=W*H||seen[n]||!grey[n])continue;if((d===-1&&xx===0)||(d===1&&xx===W-1))continue;seen[n]=1;q.push(n)}}let ww=maxx-minx+1,hh=maxy-miny+1;if(count>=5&&count<1000&&ww>=3&&hh>=3&&ww/hh>.6&&ww/hh<1.5&&count/(ww*hh)>.45)out.push({x:(minx+maxx)/2,y:(miny+maxy)/2,s:(ww+hh)/2})}return out}
function detect(){if(!active||!auto||v.readyState<2)return;let W=320,H=Math.max(120,Math.round(v.videoHeight/v.videoWidth*W));work.height=H;wx.drawImage(v,0,0,W,H);let cs=candidates(wx.getImageData(0,0,W,H).data,W,H);let best=null,score=Infinity;for(let a of cs)for(let b of cs)for(let d of cs){if(a===b||a===d||b===d)continue;let dx=b.x-a.x,dy=d.y-a.y,hor=Math.abs(b.y-a.y),ver=Math.abs(d.x-a.x),dist=Math.hypot(dx,dy);if(dx<8||dy<8||hor>dist*.28||ver>dist*.28||Math.abs(dx-dy)>dist*.4)continue;let sz=Math.abs(a.s-b.s)+Math.abs(a.s-d.s),err=hor+ver+Math.abs(dx-dy)+sz*2;if(err<score){score=err;best=[a,b,d]}}if(best){let vw=v.videoWidth,vh=v.videoHeight,s=Math.max(c.width/vw,c.height/vh),ox=(c.width-vw*s)/2,oy=(c.height-vh*s)/2;tracked=best.map(p=>({x:ox+p.x/W*vw*s,y:oy+p.y/H*vh*s}));status.textContent='Marcatori candidati rilevati · verifica l’allineamento';}else{tracked=null;status.textContent='Ricerca marcatori · tieni fermo il foglio, evita ombre';}}
function demoTransform(){let scale=Math.min(c.width/1024,c.height/1365)*.92,ox=(c.width-1024*scale)/2,oy=(c.height-1365*scale)/2;return marks.map(p=>({x:ox+p.x*scale,y:oy+p.y*scale}))}
function line(p,q,color,width=3){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
function stick(x,y,size,opacity=1){ctx.save();ctx.globalAlpha=opacity;ctx.strokeStyle='#00e9ff';ctx.lineWidth=Math.max(2,size*.11);ctx.lineCap='round';ctx.shadowColor='#00dfff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x,y-size*.63,size*.19,0,Math.PI*2);ctx.moveTo(x,y-size*.43);ctx.lineTo(x,y+size*.1);ctx.moveTo(x,y-size*.25);ctx.lineTo(x-size*.3,y);ctx.moveTo(x,y-size*.25);ctx.lineTo(x+size*.3,y);ctx.moveTo(x,y+size*.1);ctx.lineTo(x-size*.27,y+size*.48);ctx.moveTo(x,y+size*.1);ctx.lineTo(x+size*.27,y+size*.48);ctx.stroke();ctx.restore()}
function render(now){let w=window.innerWidth*devicePixelRatio,h=window.innerHeight*devicePixelRatio;if(c.width!==w||c.height!==h){c.width=w;c.height=h}ctx.clearRect(0,0,w,h);let t=tracked||(!active?demoTransform():null);if(t){if(!active){for(let seg of lineSegments)line(project(seg[0],t),project(seg[1],t),'#d7c044',2*devicePixelRatio)}let centers=lineSegments.map(seg=>project([(seg[0][0]+seg[1][0])/2,(seg[0][1]+seg[1][1])/2],t));let top=project([554,317],t);let unit=Math.max(13,Math.hypot(t[1].x-t[0].x,t[1].y-t[0].y)*.55);let sec=((now-started)/1000)%6;if(!playing)sec=phase;let pos=top,opacity=1;if(sec<1.35){let f=sec/1.35;pos={x:top.x+(centers[0].x-top.x)*f,y:top.y+(centers[0].y-top.y)*f};opacity=f>.8?Math.max(.08,(1-f)/.2):1}else if(sec<2.6){let f=(sec-1.35)/1.25;pos={x:centers[1].x+unit*.2*Math.sin(Math.PI*f),y:centers[1].y};opacity=.3+.7*Math.sin(Math.PI*f)}else if(sec<4.2){let f=(sec-2.6)/1.6;pos={x:centers[2].x,y:centers[2].y-unit*.5+unit*.9*Math.sin(Math.PI*f)};line({x:pos.x,y:centers[2].y-unit*1.7},{x:pos.x,y:pos.y-unit*.7},'#e6d96a',1.5*devicePixelRatio)}else if(sec<5.5){let f=(sec-4.2)/1.3;pos={x:centers[3].x+(centers[0].x-centers[3].x)*f,y:centers[3].y+(centers[0].y-centers[3].y)*f-unit*.45*Math.sin(Math.PI*f)}}else{let f=(sec-5.5)/.5;pos={x:centers[0].x+(top.x-centers[0].x)*f,y:centers[0].y+(top.y-centers[0].y)*f}}stick(pos.x,pos.y,unit,opacity)}requestAnimationFrame(render)}
document.getElementById('camera').onclick=async()=>{try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;await v.play();active=true;tracked=null;status.textContent='Fotocamera attiva · cerco i marcatori';document.getElementById('hint').textContent='Inquadra i tre quadratini del riquadro QR TEST';}catch(e){status.textContent='Fotocamera non disponibile: '+e.message}};document.getElementById('play').onclick=()=>{playing=!playing;if(playing)started=performance.now()-phase*1000;else phase=((performance.now()-started)/1000)%6};document.getElementById('auto').onclick=()=>{auto=!auto;tracked=null;document.getElementById('auto').textContent='Auto: '+(auto?'ON':'OFF')};document.getElementById('demo').onclick=()=>{active=false;tracked=null;if(v.srcObject){v.srcObject.getTracks().forEach(x=>x.stop());v.srcObject=null}status.textContent='Modalità demo · animazione di 6 secondi';};setInterval(()=>{if(active&&auto)detect()},700);requestAnimationFrame(render);
</script></body></html>
