<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>owl•09 — AR test 0.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:white;font:15px system-ui,sans-serif;overflow:hidden}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#stage{position:fixed;inset:0;touch-action:none;overflow:hidden}#overlay{position:absolute;left:50%;top:50%;width:300px;height:424px;transform:translate(-50%,-50%) scale(1);transform-origin:center;pointer-events:none;filter:drop-shadow(0 0 2px white)}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}button{border:1px solid #666;background:#171717e8;color:white;border-radius:9px;padding:10px;font-size:13px}#info{position:fixed;bottom:calc(env(safe-area-inset-bottom,10px) + 8px);left:12px;right:12px;text-align:center;background:#101010b8;border-radius:9px;padding:10px;font-size:12px}#ghost{opacity:.8}#actor{stroke:#00e5ff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}#rope{stroke:#00e5ff;stroke-width:1.6;stroke-dasharray:3 2}#controls{position:fixed;right:10px;top:70px;display:flex;flex-direction:column;gap:6px}#controls button{min-width:44px}#overlay{will-change:transform} .hidden{display:none!important}</style></head><body>
<video id="camera" autoplay muted playsinline></video><div id="stage"><svg id="overlay" viewBox="0 0 210 297" aria-label="Sovrapposizione animata"><g id="ghost" stroke="#ffeb3b" stroke-width="1" fill="none" opacity=".65"><path d="M112 47 V82 M60 82 V117 M88 157 V192 M128 152 L158 132"/></g><g id="rope" style="display:none"><path id="ropeLine"/></g><g id="actor" transform="translate(122 62)"><circle cx="0" cy="-8" r="3.8"/><path d="M0 -4 V8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16"/></g></svg></div>
<div id="hud"><button id="start">📷 Avvia fotocamera</button><button id="play">▶ Animazione</button><button id="guides">Guide: ON</button><button id="reset">Centra</button></div><div id="controls"><button id="plus">＋</button><button id="minus">－</button><button id="rotateL">↶</button><button id="rotateR">↷</button></div><div id="info">TEST v0.1: allinea le linee gialle alle linee stampate trascinando con un dito; ＋/－ per la scala. Questo test usa allineamento MANUALE, non ancora riconoscimento automatico.</div>
<script>
const camera=document.getElementById('camera'), overlay=document.getElementById('overlay'),actor=document.getElementById('actor'),rope=document.getElementById('rope'),ropeLine=document.getElementById('ropeLine'),stage=document.getElementById('stage');
let dx=0,dy=0,scale=1,angle=0,playing=false,startTime=0,raf=0;function render(){overlay.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${angle}deg) scale(${scale})`;}render();
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Fotocamera disponibile solo su HTTPS o localhost');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});camera.srcObject=s;await camera.play();document.getElementById('start').textContent='📷 Attiva';}catch(e){alert('Impossibile aprire la fotocamera: '+e.message+'\nPubblica il sito su HTTPS e concedi il permesso.');}}
document.getElementById('start').onclick=startCamera;
const guides=document.getElementById('ghost');document.getElementById('guides').onclick=()=>{guides.classList.toggle('hidden');document.getElementById('guides').textContent='Guide: '+(guides.classList.contains('hidden')?'OFF':'ON');};
document.getElementById('reset').onclick=()=>{dx=dy=angle=0;scale=1;render();};document.getElementById('plus').onclick=()=>{scale*=1.12;render();};document.getElementById('minus').onclick=()=>{scale/=1.12;render();};document.getElementById('rotateL').onclick=()=>{angle-=2;render();};document.getElementById('rotateR').onclick=()=>{angle+=2;render();};
let dragging=false,px=0,py=0;stage.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;stage.setPointerCapture(e.pointerId);});stage.addEventListener('pointermove',e=>{if(!dragging)return;dx+=e.clientX-px;dy+=e.clientY-py;px=e.clientX;py=e.clientY;render();});stage.addEventListener('pointerup',()=>dragging=false);
function lerp(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t));}function interp(points,t){let q=Math.min(points.length-1.00001,Math.max(0,t)*(points.length-1)),i=Math.floor(q);return [lerp(points[i][0],points[i+1][0],q-i),lerp(points[i][1],points[i+1][1],q-i)];}
// Coordinates are in A4 millimetres, matching the original PDF exactly.
function pose(t){let p=[122,62],visible=true,ropeOn=false;
 if(t<.8){p=interp([[122,62],[114,62],[112,66],[112,81]],t/.8);visible=t<.68;}
 else if(t<1.8){let u=(t-.8)/1;p=interp([[60,103],[52,101],[51,103],[60,103]],u);visible=u>.12&&u<.88;}
 else if(t<3.5){let u=(t-1.8)/1.7;p=interp([[142,143],[137,157],[132,169],[137,157],[142,143]],u);ropeOn=true;}
 else if(t<4.5){let u=(t-3.5);p=interp([[89,180],[96,165],[105,147],[115,132]],u);}
 else if(t<5.5){let u=(t-4.5);p=interp([[140,143],[156,127],[145,94],[113,70]],u);visible=u<.88;}
 else {let u=(t-5.5)/.5;p=[122,62];visible=u>.55;}
 actor.style.display=visible?'':'none';actor.setAttribute('transform',`translate(${p[0]} ${p[1]})`);rope.style.display=ropeOn?'':'none';ropeLine.setAttribute('d',`M ${p[0]} ${p[1]-8} L 158 132`);
}
function frame(now){if(!playing)return;pose(((now-startTime)/1000)%6);raf=requestAnimationFrame(frame);}document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'⏸ Ferma':'▶ Animazione';if(playing){startTime=performance.now();raf=requestAnimationFrame(frame);}else cancelAnimationFrame(raf);};pose(5.9);
</script></body></html>
